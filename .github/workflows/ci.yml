name: Offline planner checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 12 # Full DOM/unit and legal/reference guards
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducible test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify legal snapshot and regression fixtures
        run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Expanded browser matrix: 152+ cases; preserve all gates without flaky job-timeout
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducible browser dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and operating system dependencies
        run: npx playwright install --with-deps chromium
      - name: Desktop, mobile, accessibility and local-first browser gates
        run: npm run test:e2e
      # Successful runs retain their executable test logs and source-pinned
      # proof in the repo. Upload large traces/screenshots only if a prior
      # browser step failed, avoiding repeated quota warnings on green runs.
      - name: Archive browser failure evidence
        id: browser-artifacts
        continue-on-error: true # Optional failure-only upload cannot bypass required suites.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: |
            qa/browser-*.json
            qa/browser-artifacts/
          if-no-files-found: ignore
          retention-days: 3
      - name: Summarize browser evidence and upload outcome
        if: always()
        env:
          UPLOAD_OUTCOME: ${{ steps.browser-artifacts.outcome }}
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          let summary='Browser failure-evidence upload: '+process.env.UPLOAD_OUTCOME+'\n';
          try {const report=JSON.parse(readFileSync('qa/browser-results.json','utf8'));summary+='Browser suite results: '+JSON.stringify(report.stats)+'\n';}catch {summary+='Browser report unavailable; inspect test-step logs.\n';}
          try {
            const proof=JSON.parse(readFileSync('qa/direct-file-proof-current.json','utf8'));
            summary+='Source-pinned file:// technical proof (automated only): '+proof.tests.passed+'/'+proof.tests.total+
              ' · index SHA256 '+proof.sourceSha256['index.html']+
              ' · start SHA256 '+proof.sourceSha256['start.html']+'\n';
          } catch {summary+='Direct-file proof metadata unavailable.\n';}
          if(process.env.UPLOAD_OUTCOME==='skipped')summary+='No upload on successful test run; see CI logs and committed technical receipt.\n';
          else if(process.env.UPLOAD_OUTCOME!=='success')summary+='Optional failure trace upload failed; check storage quota and CI logs. Required test gates are unchanged.\n';
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);
          JS

  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify private staging artifacts
        run: node scripts/staging-build.mjs && node scripts/staging-check.mjs
      - name: Start isolated Nginx and check real HTTP security boundaries
        run: |
          docker compose -f deploy/staging/compose.yaml up --build --wait -d
          npm run staging:smoke
      - name: Stop staging and remove containers
        if: always()
        run: docker compose -f deploy/staging/compose.yaml down --remove-orphans

  # Keep the original required 'test' status context. Never equate it to a public release.
  test:
    if: always()
    needs: [node, browser, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all technical suites
        env:
          NODE_RESULT: ${{ needs.node.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          STAGING_RESULT: ${{ needs.staging.result }}
        run: |
          echo "Node: $NODE_RESULT / Browser: $BROWSER_RESULT / Staging: $STAGING_RESULT"
          test "$NODE_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$STAGING_RESULT" = success
