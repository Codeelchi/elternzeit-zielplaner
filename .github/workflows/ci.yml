name: Offline planner checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 12 # Full DOM/unit and legal/reference guards
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducible test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify legal snapshot and regression fixtures
        run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Browser matrix runs separately from Node tests
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducible browser dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and operating system dependencies
        run: npx playwright install --with-deps chromium
      - name: Desktop, mobile, accessibility and local-first browser gates
        run: npm run test:e2e
      - name: Archive browser evidence
        id: browser-artifacts
        continue-on-error: true # Evidence upload must not mask successful test gates; quota failures are summarized below.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: |
            qa/browser-*.json
            qa/browser-artifacts/
          retention-days: 14
      - name: Summarize browser evidence and upload outcome
        if: always()
        env:
          UPLOAD_OUTCOME: ${{ steps.browser-artifacts.outcome }}
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          let summary='Browser evidence upload: '+process.env.UPLOAD_OUTCOME+'\n';
          try {const report=JSON.parse(readFileSync('qa/browser-results.json','utf8'));summary+='Browser results: '+JSON.stringify(report.stats)+'\n';}catch {summary+='Browser report unavailable; inspect test-step logs.\n';}
          if(process.env.UPLOAD_OUTCOME!=='success')summary+='Artifact upload failed; inspect upload logs (storage quota may be exhausted). Checked-in QA reports and screenshots remain available.\n';
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);
          JS

  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify private staging artifacts
        run: node scripts/staging-build.mjs && node scripts/staging-check.mjs
      - name: Start isolated Nginx and check real HTTP security boundaries
        run: |
          docker compose -f deploy/staging/compose.yaml up --build --wait -d
          npm run staging:smoke
      - name: Stop staging and remove containers
        if: always()
        run: docker compose -f deploy/staging/compose.yaml down --remove-orphans

  # Keep the original required 'test' status context. Never equate it to a public release.
  test:
    if: always()
    needs: [node, browser, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all technical suites
        env:
          NODE_RESULT: ${{ needs.node.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          STAGING_RESULT: ${{ needs.staging.result }}
        run: |
          echo "Node: $NODE_RESULT / Browser: $BROWSER_RESULT / Staging: $STAGING_RESULT"
          test "$NODE_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$STAGING_RESULT" = success
