name: Offline planner checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducible test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify legal snapshot and regression fixtures
        run: npm test
      - name: Install Chromium and operating system dependencies
        run: npx playwright install --with-deps chromium
      - name: Desktop, mobile, accessibility and local-first browser gates
        run: npm run test:e2e
      - name: Archive browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: |
            qa/browser-*.json
            qa/browser-artifacts/
          retention-days: 14
