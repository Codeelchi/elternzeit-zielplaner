name: Public GitHub Pages test preview (not a product release)

on:
  workflow_dispatch:
    inputs:
      confirm_public_preview:
        description: "The site will be accessible by everyone: publish TEST PREVIEW only"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-pages-test-preview
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.confirm_public_preview == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducible test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify privacy checks and Pages preview whitelist
        run: |
          npm run privacy:technical-check
          npm run sources:check
          npm run roadmap:check
          npm run pages:check
      - name: Assert public product-release gates are STILL blocked
        run: |
          if npm run release:check; then
            echo "Refusing TEST preview: public product-release gate changed unexpectedly."
            exit 1
          fi
          echo "Release remains blocked; this is only a publicly accessible TEST preview."
      - name: Install Chromium for real browser smoke
        run: npx playwright install --with-deps chromium
      - name: Test Pages subpath, disclaimer, mobile and direct file
        run: npm run test:e2e -- tests/e2e/pages-preview.spec.mjs
      - name: Build whitelisted Pages artifact
        run: npm run pages:build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload ONLY the preview folder
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages-preview

  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_public_preview == true
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public TEST preview (not production)
        id: deployment
        uses: actions/deploy-pages@v4


  verify:
    if: github.ref == 'refs/heads/main' && inputs.confirm_public_preview == true
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Read back the exact public Pages commit, workflow run and safety notices
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
        run: |
          set -eu
          site="https://codeelchi.github.io/elternzeit-zielplaner"
          for attempt in $(seq 1 24); do
            curl --fail --silent --show-error --location --max-time 15               "$site/?test-preview-run=$EXPECTED_RUN_ID" -o /tmp/preview-index.html || true
            curl --fail --silent --show-error --location --max-time 15               "$site/start.html?test-preview-run=$EXPECTED_RUN_ID" -o /tmp/preview-start.html || true
            if test -f /tmp/preview-index.html && test -f /tmp/preview-start.html &&
              grep -Fq "$EXPECTED_SHA" /tmp/preview-index.html &&
              grep -Fq "$EXPECTED_SHA" /tmp/preview-start.html &&
              grep -Fq "Deployment-Lauf $EXPECTED_RUN_ID" /tmp/preview-index.html &&
              grep -Fq "Deployment-Lauf $EXPECTED_RUN_ID" /tmp/preview-start.html &&
              grep -Fq 'NUR FIKTIVE DATEN VERWENDEN' /tmp/preview-index.html &&
              grep -Fq 'KEIN AMTLICHER ELTERNGELDRECHNER' /tmp/preview-start.html; then
              echo "Verified public GitHub Pages preview: exact commit $EXPECTED_SHA / workflow $EXPECTED_RUN_ID"
              exit 0
            fi
            echo "Preview not yet propagated (attempt $attempt/24)."
            sleep 10
          done
          echo "::error::Public Pages readback did not match the deployed commit/run or lacked preview notices."
          exit 1
