services:
  elternzeit-staging:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8768:8080" # Only loopback; no public port
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"
